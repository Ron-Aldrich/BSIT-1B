<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f8f5;
    --surface: #ffffff;
    --text: #14211a;
    --muted: #5f6f66;
    --line: #dfe6e0;
    --accent: #2f7d55;
    --accent-soft: #e4f1e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1511;
      --surface: #151e19;
      --text: #e8f0ea;
      --muted: #8fa196;
      --line: #25322b;
      --accent: #6fcf97;
      --accent-soft: #1b2a22;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 20px 64px; }

  .back {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--text);
    font: inherit; font-size: 0.95rem; font-weight: 500;
    text-decoration: none; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .back:hover { border-color: var(--accent); background: var(--accent-soft); }
  .back svg { width: 18px; height: 18px; }

  header { margin: 48px 0 36px; }
  h1 { font-size: clamp(2rem, 6vw, 3.25rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  header p { color: var(--muted); margin-top: 10px; max-width: 46ch; }

  .topics {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
    gap: 12px;
    list-style: none; padding: 0;
  }
  .topics a {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 68px;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    font-weight: 600; font-size: 1.02rem; letter-spacing: 0.01em;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .topics a svg { width: 20px; height: 20px; flex: none; color: var(--muted); transition: color .15s, transform .15s; }
  .topics a:hover { border-color: var(--accent); }
  .topics a:hover svg { color: var(--accent); transform: translateX(3px); }

  .back:focus-visible, .topics a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- BACK BUTTON: always goes to the main page, Reviewer tab (no browser history involved) -->
  <a class="back" href="/index.html#reviewer" id="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Back
  </a>

  <header>
    <h1>Reviewer</h1>
    <p>Pick a topic to start reviewing.</p>
  </header>

  <!--
    ADD YOUR TOPICS HERE
    Copy one <li> block, change the text, and put your link in href="".
    Example: <a href="truth-table.html">
  -->
  <ul class="topics">
    <li>
      <a href="reviewer/RIZAL/topic/law_1425.html">
        RIZAL LAW (RA 1425)
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    </li>
    <li>
      <a href="#">
        WAG EXCITED
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    </li>
  </ul>

</div>
</body>
</html>
